<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ansi: color256</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jlongyam/consoleBox@1.0.7/dist/console.css">
  <script src="../../dist/ansi.js"></script>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/gh/jlongyam/consoleBox@1.0.7/dist/iife/consoleBox.js"></script>
  <script>
    var color = ansi.color;
    for (var i = 0; i < 256; i++) {
      console.log(
        color.fg256(i, 'color.fg256(' + String(i) + ')') + ' ' + color.bg256(i, 'color.bg256(' + String(i) + ')')
      );
    }
    function main() {
      for (var i = 0; i < 256; i++) {
        console.log(
          color.fg256(i, 'color.fg256(' + String(i) + ')') + ' ' + color.bg256(i, 'color.bg256(' + String(i) + ')')
        );
      }
    }
    window.addEventListener('load', function () {
      window.defaultConsole = window.console
      delete window.console;
      window.console = consoleBox;
      main()
    });
  </script>
</body>

</html>
